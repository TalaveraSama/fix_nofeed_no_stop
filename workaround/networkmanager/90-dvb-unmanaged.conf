# /etc/NetworkManager/conf.d/90-dvb-unmanaged.conf
#
# Stop NetworkManager from managing the DVB network pseudo-interfaces
# (dvb0_0, dvb1_0, ... dvbN_0) created by the dvb-core dvb_net module.
#
# When NM manages them it periodically sets the rx/multicast mode, which
# calls dvb_net_feed_stop() while no IP feed is running, flooding dmesg with:
#     dvb_net: dvbX_0: no feed to stop
#
# Making them "unmanaged" removes the trigger, so the flood stops WITHOUT
# recompiling the kernel/driver.
#
# Install:
#   sudo cp 90-dvb-unmanaged.conf /etc/NetworkManager/conf.d/
#   sudo systemctl reload NetworkManager   # or: nmcli general reload

[keyfile]
unmanaged-devices=interface-name:dvb*
